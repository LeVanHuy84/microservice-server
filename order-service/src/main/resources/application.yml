server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # hoặc validate / none tùy môi trường
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Nếu dùng Spring Cloud Config
  # config:
  #   import: "optional:configserver:http://localhost:8888"

  # Nếu dùng Kafka:
  # kafka:
  #   bootstrap-servers: localhost:9092
  #   consumer:
  #     group-id: menu-service-group
  #     auto-offset-reset: earliest

  # Nếu dùng Eureka:
  # cloud:
  #   discovery:
  #     enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

# Logging
logging:
  level:
    root: INFO
    com.yourcompany.menuservice: DEBUG

# Custom configs nếu có
order-service:
  cache-enabled: false
